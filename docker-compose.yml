# `docker compose pull && docker compose up -d`, then open http://localhost:3003
services:
  app:
    image: ghcr.io/kapsikkum/photoscout:latest
    build: .
    environment:
      API_PORT: "3003"
      # Where people reach this app from, no trailing slash. Sign-in redirects
      # back to it (<PUBLIC_URL>/api/auth/google/callback and .../discord/callback
      # are the redirect URLs to register), and writes from any other origin are refused.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3003}
      # Sign-in with Google and/or Discord. A provider is offered once both of
      # its values are set; there are no passwords.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Comma-separated provider:id accounts that are admins, e.g.
      # google:1234,discord:5678. Sign in once and read yours in Settings > Account.
      ADMIN_IDS: ${ADMIN_IDS:-}
      # Behind a reverse proxy (Caddy, nginx, Traefik), set this to the number
      # of proxies in front, usually 1.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # The database and photos; the volume below is mounted here.
      DATA_DIR: /app/data
      # TfNSW Open Data key, for the trains feed (phase 3).
      TFNSW_API_KEY: ${TFNSW_API_KEY:-}
      # adsb.lol by default; point at airplanes.live if preferred (phase 3).
      ADSB_URL: ${ADSB_URL:-https://api.adsb.lol}
      # Where the web crawler below is listening (the events engine asks it for
      # finds and sends it verdicts). Settings can point it elsewhere.
      CRAWLER_URL: ${CRAWLER_URL:-http://crawler:3002}
      # Driving directions. The bundled osrm service below, once its data is
      # preprocessed (see README: Driving directions). Unset outside Docker, it
      # falls back to the public OSRM demo, which is for development only.
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      TZ: ${TZ:-Australia/Sydney}
    # Makes host.docker.internal resolve on Linux, where it otherwise does not.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3003:3003"
    volumes:
      - photoscout-data:/app/data
    healthcheck:
      # slim images have no curl; a one-line fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # The web crawler: its own program, database and schedule. Asked for what it
  # has found over HTTP; not published to the host.
  crawler:
    image: ghcr.io/kapsikkum/photoscout-crawler:latest
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    init: true
    environment:
      CRAWLER_PORT: "3002"
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-true}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-300}
      CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH:-2}
      CRAWLER_HOST_DELAY_MS: ${CRAWLER_HOST_DELAY_MS:-1500}
      CRAWLER_INTERVAL_MIN: ${CRAWLER_INTERVAL_MIN:-30}
      TZ: ${TZ:-Australia/Sydney}
    expose:
      - "3002"
    volumes:
      - crawler-data:/app/data
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

  # Routing for Drive: OSRM on the Australia extract, preprocessed once into ./osrm
  # (README: Driving directions). Not published to the host; the app asks it.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/australia-latest.osrm
    expose:
      - "5000"
    volumes:
      - ${OSRM_DATA:-./osrm}:/data:ro
    restart: unless-stopped

volumes:
  photoscout-data:
  crawler-data:
