name: mobile

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APKs'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA'
        required: true
        type: boolean
        default: true
      default_server_url:
        description: 'Default PhotoScout server URL (leave blank for manual entry in app)'
        required: false
        type: string
        default: ''

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set default server URL if provided
        if: ${{ inputs.default_server_url != '' }}
        run: |
          echo "photoscoutServerUrl=${{ inputs.default_server_url }}" >> android/gradle.properties

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare Keystore for Release
        id: keystore
        working-directory: android
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Using repository secret keystore..."
            echo "$SIGNING_KEY" | base64 --decode > app/release.keystore
            echo "ANDROID_KEYSTORE_PATH=app/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Generating self-signed release keystore for direct installation..."
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias photoscout -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass photoscout -keypass photoscout \
              -dname "CN=PhotoScout, OU=Mobile, O=PhotoScout, L=Sydney, S=NSW, C=AU"
            echo "ANDROID_KEYSTORE_PATH=app/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=photoscout" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=photoscout" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=photoscout" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Copy & Rename APKs
        run: |
          mkdir -p dist-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/PhotoScout-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist-mobile/PhotoScout-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
            $BUILD_TOOLS/apksigner sign --ks android/app/release.keystore \
              --ks-pass pass:photoscout --key-pass pass:photoscout \
              --out dist-mobile/PhotoScout-release.apk \
              android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoScout-Android-APKs
          path: dist-mobile/*.apk
          retention-days: 30

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.build_ios
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project ios/PhotoScout.xcodeproj \
            -scheme PhotoScout \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA & App Bundle
        run: |
          mkdir -p dist-mobile
          mkdir -p ios/build/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PhotoScout.app ios/build/Payload/
          (cd ios/build && zip -r PhotoScout-unsigned.ipa Payload)
          cp ios/build/PhotoScout-unsigned.ipa dist-mobile/PhotoScout-unsigned.ipa
          (cd ios/build/Build/Products/Release-iphoneos && zip -r "$GITHUB_WORKSPACE/dist-mobile/PhotoScout-app.zip" PhotoScout.app)

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoScout-iOS-IPA
          path: dist-mobile/*
          retention-days: 30

  release:
    needs: [android, ios]
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Determine Release Tag and Title
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=PhotoScout $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=PhotoScout Mobile (Latest)" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
