name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The database layer uses node:sqlite, so nothing older will do.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npm run build -w @photoscout/density
          # tsconfig.test.json, not tsconfig.json: the build config includes only
          # src, so a type error in a test file would otherwise reach nobody —
          # tsx strips types to run them without checking any of it.
          npx tsc --noEmit -p server/tsconfig.test.json
          npx tsc --noEmit -p services/crawler/tsconfig.test.json
          npx tsc --noEmit -p web
      - name: Unit tests
        run: npm test
        # The containers run on Sydney time (docker-compose.yml); date tests assume the same.
        env:
          TZ: Australia/Sydney
      - name: Build
        run: npm run build
      - name: Waze decoder, queue and API tests
        run: |
          python3 -m venv "$RUNNER_TEMP/waze-tests"
          "$RUNNER_TEMP/waze-tests/bin/pip" install -r services/waze-harvester/requirements-dev.txt
          "$RUNNER_TEMP/waze-tests/bin/python" -m unittest discover -s services/waze-harvester -p 'test_*.py'

  image:
    needs: test
    # PRs build (no push) so a broken Dockerfile shows up before merge.
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One image per matrix entry; each keeps its own build cache.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: photoscout
            file: Dockerfile
            scope: app
          - image: photoscout-crawler
            file: services/crawler/Dockerfile
            scope: crawler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
